
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таємниці повсякденних речей</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Trebuchet MS', sans-serif;
    background: #f5f1ff;
    color: #30304d;
    line-height: 1.6;
}

header {
    background: linear-gradient(135deg, #5141a5, #9275d8);
    color: white;
    text-align: center;
    padding: 65px 20px;
}

header h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

header p {
    font-size: 19px;
}

nav {
    background: #33266f;
    padding: 16px;
    text-align: center;
    position: sticky;
    top: 0;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 12px;
    font-weight: bold;
}

nav a:hover {
    color: #ffe28a;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 35px 20px;
}

h2 {
    color: #6047a8;
    text-align: center;
    margin-bottom: 25px;
    font-size: 29px;
}

.intro {
    text-align: center;
    font-size: 18px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 15px #d9d0ed;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-7px);
}

.card .emoji {
    font-size: 45px;
}

.card h3 {
    color: #6047a8;
    margin: 12px 0;
}

.experiment {
    background: #fff5d9;
    border-radius: 18px;
    padding: 25px;
    margin: 20px 0;
}

button {
    background: #7257bd;
    color: white;
    border: none;
    border-radius: 25px;
    padding: 12px 22px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 12px;
}

button:hover {
    background: #46358b;
}

.result {
    margin-top: 15px;
    font-weight: bold;
    color: #5141a5;
}

footer {
    background: #33266f;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 35px;
}

@media(max-width: 600px) {
    header h1 {
        font-size: 28px;
    }

    nav a {
        display: inline-block;
        margin: 5px;
    }
}
</style>
</head>

<body>
